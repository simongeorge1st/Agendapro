<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pro Colaborativa By Psimon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: estilo Retro / Moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .retro-clock { font-family: 'Share Tech Mono', monospace; }
        
        @keyframes swing {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(15deg); }
            40% { transform: rotate(-15deg); }
            60% { transform: rotate(18deg); }
            80% { transform: rotate(-18deg); }
            100% { transform: rotate(0deg); }
        }
        .bell-swing { animation: swing 0.8s ease-in-out infinite; transform-origin: top center; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
            50% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }
        }
        
        /* Animación de alerta para titilar iconos y campanas */
        @keyframes bellPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0)); }
            50% { transform: scale(1.3); filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.9)); color: #ef4444; }
            100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0)); }
        }

        .chat-alert-active {
            animation: bellPulse 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Elemento de audio invisible para la campanita de notificaciones -->
    <audio id="notificationSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- Contenedor Principal de la App -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Aquí va tu estructura actual de pestañas, login, superadministrador y chat -->
    </div>

    <!-- Scripts de Firebase y Lógica de la Aplicación -->
    <!-- (Asegúrate de mantener tus scripts de Firebase SDK inicializados arriba o abajo según uses) -->
    
    <script>
        // Función para activar el sonido y el efecto visual de titileo
        function triggerNotificationAlert() {
            // Reproducir audio de campanita
            const audio = document.getElementById('notificationSound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play bloqueado por políticas del navegador:", e));
            }

            // Aplicar titileo a los iconos de chat, campana o elementos de notificación
            const chatIcons = document.querySelectorAll('.fa-comments, .fa-bell, [id*="chat"], [class*="chat"]');
            chatIcons.forEach(icon => {
                icon.classList.add('chat-alert-active');
                
                // Detener el titileo automáticamente a los 6 segundos
                setTimeout(() => {
                    icon.classList.remove('chat-alert-active');
                }, 6000);
            });
        }

        // Escucha en tiempo real de mensajes nuevos en Firestore compatible con Netlify y GitHub Pages
        function iniciarEscuchaChatTiempoReal() {
            if (typeof db === 'undefined') return;

            db.collection("chat_sucursales").orderBy("timestamp", "asc")
                .onSnapshot((snapshot) => {
                    // Evitar que salte la alerta en la carga inicial de mensajes viejos
                    let isFirstLoad = snapshot.metadata.hasPendingWrites || snapshot.empty;
                    
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const mensajeData = change.doc.data();
                            const remitente = mensajeData.remitente || mensajeData.usuario;
                            const usuarioActual = auth && auth.currentUser ? auth.currentUser.email : "";
                            
                            // Si el mensaje viene de OTRO usuario y no es la carga inicial, dispara la alerta
                            if (remitente !== usuarioActual && !isFirstLoad) {
                                triggerNotificationAlert();
                            }
                        }
                    });
                }, (error) => {
                    console.error("Error al sincronizar el chat en tiempo real:", error);
                });
        }

        // Inicializar cuando cargue el DOM o tras el login exitoso de Firebase
        document.addEventListener("DOMContentLoaded", () => {
            // Puedes invocar esta función una vez que el usuario inicie sesión correctamente
            // e.g., iniciarEscuchaChatTiempoReal();
        });
    </script>
</body>
</html>
